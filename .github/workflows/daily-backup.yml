
name: Daily Backup to Google Drive

on:
  schedule:
    # Runs daily at 05:30 IST
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL 18 client and ZIP
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates zip

          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --location \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version

      - name: Configure Google Drive
        env:
          RCLONE_CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          RCLONE_CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
          RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive
          client_id = ${RCLONE_CLIENT_ID}
          client_secret = ${RCLONE_CLIENT_SECRET}
          token = ${RCLONE_TOKEN}
          root_folder_id = ${GDRIVE_FOLDER_ID}
          EOF

          chmod 600 ~/.config/rclone/rclone.conf

      - name: Verify database and show row counts
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "RAILWAY_DATABASE_URL secret is missing."
            exit 1
          fi

          psql "$DATABASE_URL" --no-password \
            -v ON_ERROR_STOP=1 \
            -c "SELECT current_database() AS database_name;"

          psql "$DATABASE_URL" --no-password \
            -v ON_ERROR_STOP=1 \
            -c "
              SELECT table_name, row_count
              FROM (
                SELECT 'bill'::text AS table_name, COUNT(*) AS row_count
                  FROM public.bill
                UNION ALL
                SELECT 'bill_items', COUNT(*) FROM public.bill_items
                UNION ALL
                SELECT 'customer', COUNT(*) FROM public.customer
                UNION ALL
                SELECT 'products', COUNT(*) FROM public.products
              ) AS counts
              ORDER BY table_name;
            "

      - name: Dump the entire PostgreSQL database
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          set -euo pipefail

          pg_dump "$DATABASE_URL" \
            --no-password \
            --format=plain \
            --no-owner \
            --no-privileges \
            --file=database_backup.sql

          test -s database_backup.sql
          echo "Full database dump created successfully."
          du -h database_backup.sql

      - name: Create dated backup ZIP
        run: |
          set -euo pipefail

          DATE=$(date -u +%Y-%m-%d)
          BACKUP_FILE="store_managemant_backup_${DATE}.zip"

          # Archive only the database dump, not the application repository.
          zip -j "$BACKUP_FILE" database_backup.sql
          unzip -t "$BACKUP_FILE"

          echo "BACKUP_FILE=${BACKUP_FILE}" >> "$GITHUB_ENV"

      - name: Upload backup to Google Drive
        run: |
          set -euo pipefail
          rclone copy "${BACKUP_FILE}" gdrive:/
          echo "Backup uploaded: ${BACKUP_FILE}"

      - name: Delete backups older than 30 days
        run: |
          set -euo pipefail
          rclone delete gdrive:/ \
            --min-age 30d \
            --include 'store_managemant_backup_*.zip'

      - name: Show remaining backup count
        run: |
          COUNT=$(rclone lsf gdrive:/ --files-only \
            --include 'store_managemant_backup_*.zip' | wc -l)

          echo "Total retained backups: ${COUNT}"
