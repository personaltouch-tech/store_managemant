 - name: Dump the entire PostgreSQL database
  shell: bash
  env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          set -euo pipefail

          PG_DUMP="/usr/lib/postgresql/18/bin/pg_dump"

          "$PG_DUMP" "$DATABASE_URL" \
            --no-password \
            --format=plain \
            --no-owner \
            --no-privileges \
            --file=database_backup.sql

          test -s database_backup.sql
          echo "Full database backup created successfully."
          du -h database_backup.sql
